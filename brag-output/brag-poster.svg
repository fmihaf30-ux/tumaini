<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
      .poster-bg { fill: #EFF2ED; }
      .brand-title { font-family: 'Newsreader', serif; font-size: 88px; font-weight: 500; fill: #2C4E43; text-anchor: middle; }
      .brand-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 32px; font-style: italic; fill: #5C6F66; text-anchor: middle; }
      .pill-box { fill: #FFFFFF; stroke: rgba(25, 40, 35, 0.15); stroke-width: 2; rx: 36; }
      .pill-text { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 26px; font-weight: 600; fill: #2C4E43; text-anchor: middle; }
      .trust-tag { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0.08em; fill: #C98A3B; text-anchor: middle; text-transform: uppercase; }
    </style>
    <clipPath id="posterBadgeClip">
      <rect x="0" y="0" width="220" height="220" rx="44"/>
    </clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#192823" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" class="poster-bg"/>

  <!-- Centered Card Container -->
  <g transform="translate(960, 240)">
    <!-- Brand Badge with Shadow -->
    <g transform="translate(-110, 0)" filter="url(#softShadow)">
      <rect x="0" y="0" width="220" height="220" rx="44" fill="#EFF2ED"/>
      <g clip-path="url(#posterBadgeClip)">
        <circle cx="140" cy="85" r="37" fill="#C98A3B"/>
        <path d="M -10 145 Q 50 94 117 136 Q 158 162 230 138 L 230 230 L -10 230 Z" fill="#5C9784"/>
        <path d="M -10 185 Q 62 130 128 174 Q 176 202 230 176 L 230 230 L -10 230 Z" fill="#2C4E43"/>
      </g>
    </g>

    <!-- Typography -->
    <text x="0" y="340" class="brand-title">Tumaini</text>
    <text x="0" y="405" class="brand-sub">"Hope" in Swahili</text>

    <!-- Reassurance Pill -->
    <g transform="translate(-400, 460)">
      <rect width="800" height="72" class="pill-box" filter="url(#softShadow)"/>
      <text x="400" y="46" class="pill-text">Put your weight down, even for a few minutes.</text>
    </g>

    <!-- Trust Tag -->
    <text x="0" y="590" class="trust-tag">Free · 100% Anonymous · Built for Uganda</text>
  </g>
</svg>
